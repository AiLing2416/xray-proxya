name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Full binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o xray-proxya-linux-amd64 ./cmd/xray-proxya/
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w" -o xray-proxya-linux-arm64 ./cmd/xray-proxya/

      - name: Build Slim binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -tags slim -ldflags "-s -w" -o xray-proxya-slim-linux-amd64 ./cmd/xray-proxya/
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -tags slim -ldflags "-s -w" -o xray-proxya-slim-linux-arm64 ./cmd/xray-proxya/

      - name: Build Companion pathd binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o pathd-linux-amd64 ./cmd/xray-proxya-pathd/
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w" -o pathd-linux-arm64 ./cmd/xray-proxya-pathd/

      - name: Package OpenWrt APKs (Slim)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "$VERSION" ]; then
            ./scripts/package-apk.sh -a x86_64 -b xray-proxya-slim-linux-amd64 -o . -v "$VERSION"
            ./scripts/package-apk.sh -a aarch64 -b xray-proxya-slim-linux-arm64 -o . -v "$VERSION"
          else
            ./scripts/package-apk.sh -a x86_64 -b xray-proxya-slim-linux-amd64 -o .
            ./scripts/package-apk.sh -a aarch64 -b xray-proxya-slim-linux-arm64 -o .
          fi

      - name: Generate checksums
        run: |
          sha256sum \
            xray-proxya-linux-amd64 \
            xray-proxya-linux-arm64 \
            xray-proxya-slim-linux-amd64 \
            xray-proxya-slim-linux-arm64 \
            pathd-linux-amd64 \
            pathd-linux-arm64 \
            *.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            xray-proxya-linux-amd64
            xray-proxya-linux-arm64
            xray-proxya-slim-linux-amd64
            xray-proxya-slim-linux-arm64
            pathd-linux-amd64
            pathd-linux-arm64
            *.apk
            SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
